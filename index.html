<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eff8fd">
  <meta name="description" content="Un jueguito de memoria bajo un cielo celeste.">
  <title>Un cielito para vos · Cielito Arcade</title>
  <link rel="icon" href="./assets/corazon.png">
  <link rel="stylesheet" href="./estilos.css">
  <script defer src="./juego.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><i data-icon="heart"></i><em>Arcade</em></div>
      <button class="sound" id="sound" aria-pressed="false"><i data-icon="sound"></i><span>Sonido</span><span class="switch" aria-hidden="true"></span></button>
    </header>
    <main>
      <section class="story" aria-labelledby="title">
        <div class="kicker"><i data-icon="pad"></i><span id="kicker">JUEGO DE MEMORIA</span></div>
        <h1 id="title" tabindex="-1">Un cielito<br><em>para vos.</em></h1>
        <p class="intro" id="intro"> Encontrá los tres pares y descubrí la sorpresa que te espera al final.</p>
      </section>
      <div class="console-area">
        <span class="glint g1" aria-hidden="true">✦</span><span class="glint g2" aria-hidden="true">✧</span><span class="glint g3" aria-hidden="true">✧</span>
        <div class="device">
          <div class="device-top"><span class="power"><b></b> POWER</span><span class="stripes" aria-hidden="true"></span></div>
          <div class="bezel">
            <div id="screen" class="screen">
              <img class="landscape" src="./assets/cielito.webp" alt="Dos conejitos miran la luna junto a un lago celeste.">
              <div id="hud" aria-hidden="true"><span class="tinyheart"></span><span class="tinyheart"></span><span class="tinyheart"></span></div>
              <div id="overlay"></div>
            </div>
          </div>
          <div class="console-name"><span></span> POCKET RABBIT <span></span></div>
          <div class="controls">
            <div class="pad" role="group" aria-label="Mover la selección"><span></span>
              <button data-move="up" aria-label="Arriba">▴</button><button data-move="left" aria-label="Izquierda">◂</button><button data-move="right" aria-label="Derecha">▸</button><button data-move="down" aria-label="Abajo">▾</button>
            </div>
            <div class="speaker" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
            <div class="rounds"><button id="b" aria-label="Volver" title="Volver">B</button><button id="a" aria-label="Elegir o continuar" title="Elegir o continuar">A</button></div>
          </div>
        </div>
      </div>
      <section class="action" aria-label="Acciones del juego">
        <div id="buttons"><button class="primary" id="start"><i data-icon="play"></i>Empezar a jugar</button></div>
        <div class="progress"><span class="hearts" id="hearts" aria-hidden="true"></span><span id="progress">0 de 3 pares</span></div>
      </section>
    </main>
    <footer><span class="footline"></span><span>Hecho con <i data-icon="heart"></i> por <span id="signature">Daniel</span></span><span class="footline"></span></footer>
    <span class="sr" role="status" aria-live="polite" id="announcement"></span>
  </div>
  <noscript>Activá JavaScript para jugar.</noscript>
</body>
</html>
